# Full local environment: Counterpart against DynamoDB Local.
services:
  dynamodb:
    image: amazon/dynamodb-local
    # -sharedDb: a single database for any credentials and region (the seed and the server see
    # the same tables). -inMemory: nothing persists; after restarting the container you must reseed.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  counterpart:
    build: .
    ports:
      - "3000:3000"
    environment:
      COUNTERPART_STORE: dynamo
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: counterpart
      AWS_REGION: us-east-1
      COUNTERPART_ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      - dynamodb
    # If it starts before DynamoDB Local, creating the table fails: it retries.
    restart: on-failure

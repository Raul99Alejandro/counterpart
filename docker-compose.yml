# Entorno local completo: Counterpart contra DynamoDB Local.
services:
  dynamodb:
    image: amazon/dynamodb-local
    # -sharedDb: una sola base para cualquier credencial y región (la siembra y el servidor ven
    # las mismas tablas). -inMemory: nada persiste; al reiniciar el contenedor hay que resembrar.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  counterpart:
    build: .
    ports:
      - "3000:3000"
    environment:
      COUNTERPART_STORE: dynamo
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: counterpart
      AWS_REGION: us-east-1
      COUNTERPART_ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      - dynamodb
    # Si arranca antes que DynamoDB Local, crear la tabla falla: se reintenta.
    restart: on-failure

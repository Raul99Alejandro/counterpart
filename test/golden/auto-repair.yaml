# Golden phrases: each one with the tool and arguments the model should pick.
# They run in order, in a single session, against a freshly made seed:
# some depend on earlier ones (for example, "Sam's truck" is the order the Sam Reyes phrase opens).
profile: auto-repair
phrases:
  - say: "How's the shop looking today?"
    tool: get_shop_snapshot
    args: {}
  - say: "Give me the rundown for today"
    tool: get_shop_snapshot
    args: {}
  - say: "What's waiting on parts?"
    tool: find_work_orders
    args: { stage: waiting_on_parts }
  - say: "What's in the bay right now?"
    tool: find_work_orders
    args: { stage: in_bay }
  - say: "Anything ready for pickup?"
    tool: find_work_orders
    args: { stage: ready_for_pickup }
  - say: "Pull up Dana Lee's job"
    tool: find_work_orders
    args: { query: "Dana Lee" }
  - say: "Open a work order for Jordan Diaz's 2019 Honda Accord, front brakes"
    tool: open_work_order
    args: { customerName: "Jordan Diaz", asset: { year: 2019, make: "Honda", model: "Accord" }, description: "front brakes" }
  - say: "Start a new RO for Sam Reyes, 2020 Ford F-150, oil change"
    tool: open_work_order
    args: { customerName: "Sam Reyes", asset: { year: 2020, make: "Ford", model: "F-150" }, description: "oil change" }
  - say: "Move the blue sedan into the bay"
    tool: move_work_order_stage
    args: { order: "the blue sedan", stage: in_bay }
  - say: "The green wagon is waiting on parts"
    tool: move_work_order_stage
    args: { order: "the green wagon", stage: waiting_on_parts }
  - say: "Mark order 44 ready for pickup"
    tool: move_work_order_stage
    args: { order: "order 44", stage: ready_for_pickup }
  - say: "Add front brake pads to the blue sedan"
    tool: add_parts_or_labor
    args: { order: "the blue sedan", item: "front brake pads" }
  - say: "Put two hours of diagnostic on the gray coupe"
    tool: add_parts_or_labor
    args: { order: "the gray coupe", item: "diagnostic", quantity: 2 }
  - say: "Add an oil change to Sam's truck"
    tool: add_parts_or_labor
    args: { order: "Sam's truck", item: "oil change" }
  - say: "Do we have 5W-30?"
    tool: check_parts_stock
    args: { item: "5W-30" }
  - say: "What parts are running low?"
    tool: check_parts_stock
    args: {}
  - say: "Reorder whatever's low"
    tool: reorder_parts
    args: {}
  - say: "Order more brake rotors"
    tool: reorder_parts
    args: { item: "brake rotors" }
  - say: "Close out the silver crossover, they paid by card"
    tool: close_out_work_order
    args: { order: "the silver crossover", paymentMethod: card }
  - say: "Owen paid cash for the black pickup, close it out"
    tool: close_out_work_order
    args: { order: "the black pickup", paymentMethod: cash }
  - say: "How did we do this week compared to last week?"
    tool: sales_report
    args: { period: this_week }
  - say: "What were yesterday's sales?"
    tool: sales_report
    args: { period: yesterday }
